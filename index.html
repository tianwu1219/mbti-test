<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBTI 深度人格測驗（含職涯與優缺點分析）</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif; }
    body { background-color: #fdf6ec; color: #4a3b32; padding: 24px 16px; line-height: 1.65; }
    .container { max-width: 740px; margin: 0 auto; background: #fffdf9; padding: 32px 28px; border-radius: 20px; box-shadow: 0 8px 30px rgba(196, 137, 78, 0.08); border: 1px solid #f7e8d3; }
    h1 { text-align: center; color: #8c532b; margin-bottom: 8px; font-size: 26px; }
    .subtitle { text-align: center; color: #a47148; font-size: 14px; margin-bottom: 28px; }
    .question-block { margin-bottom: 24px; padding-bottom: 18px; border-bottom: 1px solid #faeedd; }
    .question-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: #5c3e29; }
    .option-label { display: flex; align-items: center; background: #faf3ea; border: 1px solid #f2e1cf; padding: 10px 14px; border-radius: 10px; margin-bottom: 8px; cursor: pointer; font-size: 14px; color: #533e2d; transition: all 0.2s ease; }
    .option-label:hover { background: #f5e7d5; border-color: #e5c9ad; transform: translateY(-1px); }
    .option-label input { margin-right: 12px; cursor: pointer; accent-color: #c97a3e; width: 16px; height: 16px; }
    .btn { display: block; width: 100%; background: #d97736; color: #ffffff; border: none; padding: 14px; font-size: 16px; font-weight: 700; border-radius: 12px; cursor: pointer; transition: 0.2s; margin-top: 12px; box-shadow: 0 4px 12px rgba(217, 119, 54, 0.25); }
    .btn:hover { background: #c26425; box-shadow: 0 6px 16px rgba(217, 119, 54, 0.35); }
    .error-msg { color: #c2410c; text-align: center; margin-top: 14px; font-size: 14px; display: none; font-weight: 500; }
    #result-box { display: none; padding: 8px 0; }
    .result-header { text-align: center; margin-bottom: 28px; }
    .result-type { font-size: 44px; font-weight: 800; color: #c26425; letter-spacing: 3px; }
    .result-title { font-size: 19px; color: #7c4a27; margin-top: 6px; font-weight: 600; }
    .card { background: #faf4ec; border: 1px solid #f0e0ce; border-radius: 14px; padding: 18px 22px; margin-bottom: 18px; }
    .card h3 { font-size: 16px; color: #8c532b; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
    .card p { font-size: 14.5px; color: #5a4332; line-height: 1.7; }
    .btn-secondary { background: #b8a898; color: #fff; margin-top: 24px; box-shadow: none; }
    .btn-secondary:hover { background: #9d8c7c; box-shadow: none; }

    /* 本機紀錄專用樣式 */
    .history-card { margin-top: 28px; border-top: 2px dashed #eedac5; padding-top: 20px; }
    .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .history-title { font-size: 16px; font-weight: 700; color: #8c532b; }
    .btn-clear { background: transparent; border: 1px solid #c9a98e; color: #8c532b; font-size: 12px; padding: 4px 10px; border-radius: 6px; cursor: pointer; transition: 0.2s; }
    .btn-clear:hover { background: #f2dec8; }
    .history-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }

    .history-date { color: #8a705e; }
    .history-res { font-weight: 700; color: #c26425; }
    .history-empty { text-align: center; color: #a48570; font-size: 13px; padding: 12px 0; }

</head>
<body>

<div class="container">
  <div id="quiz-box">
    <h1>MBTI 深度人格測驗【最新版】</h1>
    <p class="subtitle">請先選擇測驗題數。題數越多，結果通常越穩定；請依照直覺與平常的真實習慣作答</p>
    <div id="count-select" class="card" style="text-align:center; margin-bottom:18px;">
      <h3>🔢 你想測幾題？</h3>
      <p style="margin:8px 0 14px; color:#8a705e;">每個人格向度都會平均分配題目</p>
      <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center;">
        <button type="button" class="btn count-btn" data-count="16">16 題<br><small>快速測驗</small></button>
        <button type="button" class="btn count-btn" data-count="24">24 題<br><small>標準測驗</small></button>
        <button type="button" class="btn count-btn" data-count="36">36 題<br><small>完整測驗</small></button>
      </div>
      <p id="selected-count" style="margin-top:12px; color:#c26425; font-weight:700;"></p>
    </div>
    <div id="questions-container" style="display:none;"></div>
    <button id="submit-btn" class="btn">查看分析結果</button>
    <p id="error-text" class="error-msg">還有題目尚未作答完成，請往上確認並填寫完畢喔！</p>
  </div>

  <div id="result-box">
    <div class="result-header">
      <div id="res-type" class="result-type"></div>
      <div id="res-name" class="result-title"></div>
      <div id="res-score-detail" style="font-size: 13px; color: #a47148; margin-top: 6px;"></div>
    </div>
    
    <div class="card">
      <h3>🌟 性格特質與長處</h3>
      <p id="res-strengths"></p>
    </div>

    <div class="card">
      <h3>⚠️ 潛在短板與盲點</h3>
      <p id="res-weaknesses"></p>
    </div>

    <div class="card">
      <h3>💼 適合發展的工作方向</h3>
      <p id="res-careers"></p>
    </div>

    <!-- 本機歷史紀錄區塊 -->
    <div class="history-card">
      <div class="history-header">
        <span class="history-title">📜 歷史測驗紀錄（本機儲存）</span>
        <button id="clear-history-btn" class="btn-clear">清除紀錄</button>
      </div>
      <ul id="history-list" class="history-list"></ul>
    </div>

    <button id="restart-btn" class="btn btn-secondary">重新測驗</button>
  </div>
</div>

<script>

  // 16 種人格解析資料庫
  const infoData = {

    "ISFJ": { name: "溫暖貼心的守護者", s: "細膩周到、忠誠可靠、極具責任感、擅長照顧與支持團隊。", w: "過度承擔他人責任、不善於拒絕別人、容易把委屈往心裡吞。", c: "醫療護理、教育輔導、行政管理、人力資源、社會工作。" },

    "ISTP": { name: "冷靜靈活的實踐家", s: "動手能力強、危機應變極佳、善於拆解機械原理、冷靜理性。", w: "難以長久維持承諾、對人際溝通較冷淡、不喜受規則長篇約束。", c: "軟體開發/資安、機械工程、急診醫療、飛行駕駛、技術技師。" },
    "ISFP": { name: "溫和靈動的藝術家", s: "審美直覺敏銳、包容力強、熱愛當下美好、真誠善良且不具侵略性。", w: "抗壓性相對偏弱、排斥長期規劃、遇到爭端時習慣退縮逃避。", c: "視覺設計、藝術插畫、攝影剪輯、景觀園藝、音樂創作。" },
    "INFP": { name: "溫柔真誠的調停者", s: "理想崇高、同理心充沛、想像力豐富、對自我價值觀堅定不移。", w: "容易陷入情緒內耗、行動力有時跟不上想法、容易過度理想化。", c: "文學寫作、心理諮詢、創意企劃、翻譯、自由工作者。" },
    "INTP": { name: "追求真理的思想家", s: "思考極具原創性、邏輯拆解能力強、對未知原理充滿求知欲。", w: "想多做少易拖延、說話偶爾過於直白挑刺、容易忽略他人情緒。", c: "演算法工程、科學理論研究、哲學探討、數據科學家、系統研發。" },
    "ESTP": { name: "活力敏捷的挑戰者", s: "行動力超群、談判與應變靈活、觀察周遭即時變化極為敏銳。", w: "容易衝動冒險、耐心較不足、排斥繁瑣理論與長篇大論的規範。", c: "商務談判、專案業務、危機公關、運動教練、創業家。" },
    "ESFP": { name: "光芒四射的表演者", s: "親和力十足、極具舞台感染力、善於炒熱氣氛、熱愛分享歡樂。", w: "注意力容易分散、不喜深層嚴肅問題、花費與時間規劃較隨性。", c: "公關活動策劃、演藝主持、觀光休閒、行銷推廣、客戶關係。" },
    "ENFP": { name: "熱情洋溢的探索者", s: "點子極多、充滿熱情感染力、善於啟發他人、極具創新開拓精神。", w: "容易三分鐘熱度、對瑣碎收尾工作缺乏耐心、情緒起伏較大。", c: "品牌行銷、廣告文案、自媒體創作、活動策展、創新顧問。" },
    "ENTP": { name: "機智敏銳的辯論家", s: "腦袋反應飛快、幽默機靈、敢於打破框架挑戰現狀、思維靈活。", w: "喜歡爭辯易引發磨擦、執行落實常顯乏力、容易半途轉換跑道。", c: "創業顧問、產品經理、創投分析、政策智囊、辯護律師。" },
    "ESTJ": { name: "果斷務實的管理者", s: "組織架構能力強、執行力果決、講求規則秩序、責任心極度堅定。", w: "控制欲較強、不擅理解非理性感受、容易顯得固執不知變通。", c: "企業專案主管、營運管理、軍警執法、工程監工、金融財務主管。" },
    "ESFJ": { name: "熱心溫暖的領航員", s: "人際關係極佳、重視團體凝聚力、擅長打理後勤、體貼照顧他人。", w: "極度在意他人眼光與評價、害怕衝突、容易忽略自己的真實需求。", c: "公關接待、人力資源、教學教師、活動行政、客戶服務管理。" },
    "ENFJ": { name: "鼓舞人心的主人公", s: "領袖魅力強大、善於凝聚眾人意志、極富同理心、能激發他人潛力。", w: "容易過度理想化他人、承攬太多別人的情緒負擔、過於想掌控大局。", c: "團隊主管、培訓導師、公眾演說家、非營利組織領袖、人力發展。" },
    "ENTJ": { name: "雄心勃勃的指揮官", s: "大局觀清晰、決策雷厲風行、領導統御力卓越、勇於開疆闢土。", w: "容易顯得專斷強勢、缺乏同理耐心、常給身邊的人帶來巨大壓迫感。", c: "高階企業主管、創業創辦人、管理顧問、投資銀行家、政治領袖。" }
  };

  const container = document.getElementById('questions-container');
  const submitBtn = document.getElementById('submit-btn');
  const restartBtn = document.getElementById('restart-btn');
  const clearHistoryBtn = document.getElementById('clear-history-btn');
  const historyListEl = document.getElementById('history-list');
  const errorText = document.getElementById('error-text');
  const quizBox = document.getElementById('quiz-box');
  const countSelect = document.getElementById('count-select');
  const selectedCountText = document.getElementById('selected-count');
  const countButtons = document.querySelectorAll('.count-btn');
  let currentQuestions = [];
  let selectedCount = 0;
  const resultBox = document.getElementById('result-box');

  // 讀取與渲染本機紀錄
  function getHistory() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch (e) {
      return [];
    }
  }

  function saveHistoryItem(type, name) {
    const list = getHistory();
    const now = new Date();
    const timeStr = `${now.getFullYear()}/${(now.getMonth() + 1).toString().padStart(2, '0')}/${now.getDate().toString().padStart(2, '0')} ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
    
    // 最多保存最新 10 筆
    list.unshift({ time: timeStr, type: type, name: name });
    if (list.length > 10) {
      list.pop();
    }
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  }

  function renderHistory() {
    const list = getHistory();
    historyListEl.innerHTML = '';
    if (list.length === 0) {
      const emptyLi = document.createElement('li');
      emptyLi.className = 'history-empty';
      emptyLi.textContent = '目前尚無歷史測驗紀錄';
      historyListEl.appendChild(emptyLi);
      return;
    }

    list.forEach(item => {
      const li = document.createElement('li');
      li.className = 'history-item';

      const dateSpan = document.createElement('span');
      dateSpan.className = 'history-date';
      dateSpan.textContent = item.time;

      const resSpan = document.createElement('span');
      resSpan.className = 'history-res';
      resSpan.textContent = `${item.type} (${item.name})`;

      li.appendChild(dateSpan);
      li.appendChild(resSpan);
      historyListEl.appendChild(li);
    });
  }

  // 清除本機紀錄
  clearHistoryBtn.addEventListener('click', () => {
    localStorage.removeItem(STORAGE_KEY);
    renderHistory();
  });

  function shuffle(arr) {
    const copy = [...arr];
    for (let i = copy.length - 1; i > 0; i--) {
      const k = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[k]] = [copy[k], copy[i]];
    }
    return copy;
  }

  function startQuiz(count) {
    selectedCount = count;
    const perDimension = count / 4;
    const dimensions = ['EI', 'SN', 'TF', 'JP'];
    currentQuestions = dimensions.flatMap(dim =>
      shuffle(rawQuestions.filter(q => q.dim === dim)).slice(0, perDimension)
    );
    currentQuestions = shuffle(currentQuestions);
    selectedCountText.textContent = `已選擇 ${count} 題，現在開始作答！`;
    countSelect.style.display = 'none';
    container.style.display = 'block';
    submitBtn.style.display = 'block';
    errorText.style.display = 'none';
    container.innerHTML = '';

    currentQuestions.forEach((q, i) => {
      const qDiv = document.createElement('div');
      qDiv.className = 'question-block';
      const titleEl = document.createElement('div');
      titleEl.className = 'question-title';
      titleEl.textContent = `${i + 1}. ${q.t.replace(/^\d+\.\s*/, '')}`;
      qDiv.appendChild(titleEl);
      const d1 = q.dim[0];
      const d2 = q.dim[1];
      const opts = shuffle([
        { text: q.a, trait: d1, score: 2 },
        { text: q.b, trait: d1, score: 1 },
        { text: q.c, trait: d2, score: 1 },
        { text: q.d, trait: d2, score: 2 }
      ]);
      opts.forEach(opt => {
        const label = document.createElement('label');
        label.className = 'option-label';
        const radio = document.createElement('input');
        radio.type = 'radio';
        radio.name = `q_${i}`;
        radio.value = opt.trait;
        radio.dataset.score = opt.score;
        label.appendChild(radio);
        label.appendChild(document.createTextNode(opt.text));
        qDiv.appendChild(label);
      });
      container.appendChild(qDiv);
    });
  }

  countButtons.forEach(btn => {
    btn.addEventListener('click', () => startQuiz(Number(btn.dataset.count)));
  });

  // 計算並展示結果（依實際分數計算 + 寫入本機紀錄）
  submitBtn.addEventListener('click', () => {
    let answered = 0;

    currentQuestions.forEach((_, i) => {
      const checked = document.querySelector(`input[name="q_${i}"]:checked`);
      if (checked) {
        answered++;
      }
    });

    if (answered < currentQuestions.length) {
      errorText.style.display = 'block';
      return;
    }

    errorText.style.display = 'none';

    // 依作答累積各維度分數並計算結果
    const scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
    currentQuestions.forEach((q, i) => {
      const checked = document.querySelector(`input[name="q_${i}"]:checked`);
      if (!checked) return;
      scores[checked.value] += Number(checked.dataset.score);
    });

    const type = [
      scores.E >= scores.I ? 'E' : 'I',
      scores.S >= scores.N ? 'S' : 'N',
      scores.T >= scores.F ? 'T' : 'F',
      scores.J >= scores.P ? 'J' : 'P'
    ].join('');

    const info = infoData[type] || infoData["ESTJ"];

    document.getElementById('res-type').textContent = type;
    document.getElementById('res-name').textContent = info ? info.name : "";

    // 顯示各人格向度比例，讓結果不只是一個四字母標籤
    function percent(a, b) {
      const total = a + b;
      return total === 0 ? 50 : Math.round((a / total) * 100);
    }
    const ei = percent(scores.E, scores.I);
    const sn = percent(scores.S, scores.N);
    const tf = percent(scores.T, scores.F);
    const jp = percent(scores.J, scores.P);
    document.getElementById('res-score-detail').textContent =
      `傾向比例：E ${ei}% / I ${100 - ei}% ｜ S ${sn}% / N ${100 - sn}% ｜ T ${tf}% / F ${100 - tf}% ｜ J ${jp}% / P ${100 - jp}%`;
    document.getElementById('res-strengths').textContent = info ? info.s : "";
    document.getElementById('res-weaknesses').textContent = info ? info.w : "";
    document.getElementById('res-careers').textContent = info ? info.c : "";

    // 儲存並更新本機紀錄
    saveHistoryItem(type, info ? info.name : "");
    renderHistory();

    quizBox.style.display = 'none';
    resultBox.style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // 重新測驗：回到題數選擇
  restartBtn.addEventListener('click', () => {
    currentQuestions = [];
    selectedCount = 0;
    container.innerHTML = '';
    container.style.display = 'none';
    submitBtn.style.display = 'none';
    errorText.style.display = 'none';
    selectedCountText.textContent = '';
    countSelect.style.display = 'block';
    resultBox.style.display = 'none';
    quizBox.style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // 初始狀態：先選題數
  submitBtn.style.display = 'none';
});
</script>
